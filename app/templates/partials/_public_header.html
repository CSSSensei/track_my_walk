<div id="sticky-header-container">
    <header class="sticky-header-content">
        <h1 class="site-title">
            <a href="{{ url_for('main.index') }}" aria-label="Track my walk">
                <img class="site-logo" src="{{ url_for('static', filename='images/logo/logo-w.svg') }}" alt="Track my walk" width="320" height="34">
            </a>
        </h1>

        {% if show_theme_toggle %}
            <button id="themeToggle" class="theme-toggle-button" type="button" aria-label="Toggle theme">
                <img id="themeIcon" width="24" height="24" src="" alt="Theme toggle">
            </button>
        {% endif %}
    </header>
</div>
